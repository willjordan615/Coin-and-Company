<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin and Company Trait Reference</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --panel: #1a1e22;
      --panel-2: #23282e;
      --border: #353c44;
      --text: #f1eee7;
      --muted: #a9b0b7;
      --accent: #c59a54;
      --accent-2: #e4c484;
      --good: #77b985;
      --blue: #6aa6d8;
      --violet: #a790d8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--border); background: rgba(17,19,21,.96); padding: .85rem 1rem; }
    .top { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1rem; align-items: center; }
    h1 { margin: 0; font-size: 1.25rem; line-height: 1.1; }
    .subhead { margin: .24rem 0 0; color: var(--muted); font-size: .86rem; line-height: 1.3; }
    .controls { display: flex; align-items: center; gap: .5rem; }
    input, select { min-height: 38px; border: 1px solid var(--border); border-radius: 8px; background: #101316; color: var(--text); padding: .5rem .65rem; font: inherit; }
    input { width: min(320px, 42vw); }
    main { max-width: 1280px; margin: 0 auto; padding: 1rem; display: grid; gap: 1rem; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .6rem; }
    .summary-card, .section, .trait-card { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
    .summary-card { padding: .7rem .8rem; }
    .summary-card strong { display: block; color: var(--accent-2); font-size: 1.2rem; line-height: 1; margin-bottom: .24rem; }
    .summary-card span { color: var(--muted); font-size: .78rem; }
    .section { overflow: hidden; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .75rem .85rem; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.025); }
    .section-head h2 { margin: 0; font-size: .92rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-2); }
    .section-head span { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .facility-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .55rem; padding: .75rem; }
    .facility-card { border: 1px solid rgba(255,255,255,.07); border-radius: 8px; background: var(--panel-2); padding: .65rem; }
    .facility-card h3 { margin: 0 0 .45rem; font-size: .86rem; }
    .chip-row { display: flex; flex-wrap: wrap; gap: .28rem; }
    .chip { border: 1px solid rgba(197,154,84,.34); border-radius: 999px; background: rgba(197,154,84,.1); color: var(--accent-2); padding: .16rem .42rem; font-size: .72rem; line-height: 1.15; }
    .chip.rare { border-color: rgba(167,144,216,.48); color: #d9ccff; background: rgba(167,144,216,.12); }
    .trait-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .6rem; padding: .75rem; }
    .trait-card { display: grid; grid-template-rows: auto auto 1fr; min-height: 260px; padding: .75rem; background: var(--panel-2); }
    .trait-card.profession { border-color: rgba(106,166,216,.42); }
    .trait-card.trainable { box-shadow: inset 3px 0 0 rgba(197,154,84,.72); }
    .trait-card.contract-only { opacity: .86; }
    .trait-title { display: flex; align-items: flex-start; justify-content: space-between; gap: .6rem; margin-bottom: .45rem; }
    .trait-title h3 { margin: 0; font-size: 1rem; line-height: 1.1; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .22rem; }
    .badge { border: 1px solid var(--border); border-radius: 999px; color: var(--muted); padding: .1rem .34rem; font-size: .66rem; white-space: nowrap; }
    .badge.profession { color: #b9dcff; border-color: rgba(106,166,216,.44); background: rgba(106,166,216,.1); }
    .badge.random { color: #bce7c4; border-color: rgba(119,185,133,.44); background: rgba(119,185,133,.1); }
    .badge.facility { color: var(--accent-2); border-color: rgba(197,154,84,.44); background: rgba(197,154,84,.1); }
    .badge.rare { color: #d9ccff; border-color: rgba(167,144,216,.48); background: rgba(167,144,216,.12); }
    .detail-list { display: grid; gap: .5rem; }
    .detail-block strong { display: block; margin-bottom: .18rem; color: var(--accent-2); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
    .detail-block p, .detail-block li { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.28; }
    .detail-block ul { margin: 0; padding-left: 1rem; display: grid; gap: .18rem; }
    .empty { color: var(--muted); font-style: italic; padding: .9rem; }
    .hidden { display: none !important; }
    @media (max-width: 1120px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .facility-grid, .trait-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 720px) {
      .top { grid-template-columns: 1fr; }
      .controls { align-items: stretch; display: grid; grid-template-columns: 1fr; }
      input { width: 100%; }
      .summary-grid, .facility-grid, .trait-grid { grid-template-columns: 1fr; }
      .trait-card { min-height: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <h1>Trait Reference</h1>
        <p class="subhead">Live reference pulled from the game data: origins, contract fit, facility sources, and engine effects.</p>
      </div>
      <div class="controls" aria-label="Trait filters">
        <input id="search" type="search" placeholder="Search traits, domains, effects">
        <select id="originFilter">
          <option value="all">All origins</option>
          <option value="profession">Professions</option>
          <option value="random">Random traits</option>
          <option value="facility">Facility-trained</option>
          <option value="contract-only">Contract/patron only</option>
        </select>
      </div>
    </div>
  </header>
  <main>
    <section class="summary-grid" id="summaryGrid"></section>
    <section class="section">
      <div class="section-head">
        <h2>Facility Sources</h2>
        <span>Regular and rare training pools</span>
      </div>
      <div class="facility-grid" id="facilityGrid"></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>Professions</h2>
        <span id="professionCount"></span>
      </div>
      <div class="trait-grid" id="professionGrid"></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>Trainable And Random Traits</h2>
        <span id="traitCount"></span>
      </div>
      <div class="trait-grid" id="traitGrid"></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>Contract And Patron Tags</h2>
        <span id="tagCount"></span>
      </div>
      <div class="trait-grid" id="tagGrid"></div>
    </section>
  </main>
  <script>
    const state = { cards: [] };
    const $ = id => document.getElementById(id);

    Promise.all([
      fetch('../data/character_parts.json').then(r => r.json()),
      fetch('../data/contract_parts.json').then(r => r.json()),
      fetch('../data/statuses.json').then(r => r.json())
    ]).then(([characterParts, contractParts, statuses]) => {
      buildReference(characterParts, contractParts, statuses);
      $('search').addEventListener('input', applyFilters);
      $('originFilter').addEventListener('change', applyFilters);
    }).catch(error => {
      document.querySelector('main').innerHTML = `<p class="empty">Could not load game data. Open this page through the local server, not directly from the filesystem.</p>`;
      console.error(error);
    });

    function buildReference(characterParts, contractParts, statuses) {
      const statusName = new Map(statuses.map(status => [status.id, status.name]));
      const professions = characterParts.professions || [];
      const professionByName = new Map(professions.map(profession => [profession.name, profession]));
      const randomTraits = new Set(characterParts.traits || []);
      const facilityOrigins = collectFacilityOrigins(contractParts.facilities || []);
      const contractUses = collectContractUses(contractParts.jobs || []);
      const allNames = [...new Set([
        ...professions.map(profession => profession.name),
        ...randomTraits,
        ...Object.keys(characterParts.tagAffinities || {}),
        ...Object.keys(characterParts.traitEffects || {}),
        ...facilityOrigins.keys(),
        ...contractUses.keys()
      ])].sort((a, b) => a.localeCompare(b));

      $('summaryGrid').innerHTML = [
        summaryCard(allNames.length, 'total tags'),
        summaryCard(professions.length, 'professions'),
        summaryCard(randomTraits.size, 'random secondary traits'),
        summaryCard([...facilityOrigins.keys()].length, 'facility-trained traits')
      ].join('');
      renderFacilities(contractParts.facilities || []);

      const models = allNames.map(name => traitModel(name, {
        characterParts,
        statusName,
        profession: professionByName.get(name),
        isRandom: randomTraits.has(name),
        facilityOrigins: facilityOrigins.get(name) || [],
        contractUse: contractUses.get(name) || { primary: [], support: [] }
      }));

      renderGroup('professionGrid', 'professionCount', models.filter(model => model.kind === 'profession'));
      renderGroup('traitGrid', 'traitCount', models.filter(model => model.kind === 'trait'));
      renderGroup('tagGrid', 'tagCount', models.filter(model => model.kind === 'contract-only'));
      state.cards = Array.from(document.querySelectorAll('.trait-card'));
      applyFilters();
    }

    function collectFacilityOrigins(facilities) {
      const origins = new Map();
      const add = (trait, origin) => {
        if (!origins.has(trait)) origins.set(trait, []);
        origins.get(trait).push(origin);
      };
      for (const facility of facilities) {
        for (const trait of facility.traits || []) add(trait, { type: 'facility', label: facility.label, chance: facility.trainChance });
        for (const trait of facility.rareTraits || []) add(trait, { type: 'rare', label: facility.label, chance: Math.round((facility.rareChance ?? 0.12) * 100) });
      }
      return origins;
    }

    function collectContractUses(jobs) {
      const uses = new Map();
      const ensure = trait => {
        if (!uses.has(trait)) uses.set(trait, { primary: [], support: [] });
        return uses.get(trait);
      };
      for (const job of jobs) {
        for (const trait of job.traits || []) ensure(trait).primary.push(job.type);
        for (const trait of job.support || []) ensure(trait).support.push(job.type);
      }
      return uses;
    }

    function traitModel(name, context) {
      const affinity = context.characterParts.tagAffinities?.[name] || null;
      const effects = context.characterParts.traitEffects?.[name] || [];
      const origins = [];
      if (context.profession) origins.push('profession');
      if (context.isRandom) origins.push('random');
      if (context.facilityOrigins.some(origin => origin.type === 'facility')) origins.push('facility');
      if (context.facilityOrigins.some(origin => origin.type === 'rare')) origins.push('rare');
      const kind = context.profession ? 'profession' : (context.isRandom || context.facilityOrigins.length ? 'trait' : 'contract-only');
      const search = [
        name,
        affinity?.description,
        ...(affinity?.domains || []),
        ...context.contractUse.primary,
        ...context.contractUse.support,
        ...effects.map(effect => effect.description || ''),
        ...context.facilityOrigins.map(origin => origin.label)
      ].filter(Boolean).join(' ').toLowerCase();
      return {
        name,
        kind,
        origins,
        search,
        html: traitCardHtml(name, context, affinity, effects, kind, origins, search)
      };
    }

    function traitCardHtml(name, context, affinity, effects, kind, origins, search) {
      const classes = ['trait-card', kind];
      if (origins.includes('facility') || origins.includes('rare')) classes.push('trainable');
      const badges = origins.length ? origins.map(origin => `<span class="badge ${origin}">${originLabel(origin)}</span>`).join('') : '<span class="badge">tag</span>';
      const profession = context.profession
        ? `<p>${context.statusName.get(context.profession.status) || context.profession.status}; ${context.profession.resources} Res, ${context.profession.connections} Conn before variance.</p>`
        : `<p>${kind === 'contract-only' ? 'Appears as a contract, support, or patron tag.' : 'Can appear as a secondary trait or through training.'}</p>`;
      const facilityText = context.facilityOrigins.length
        ? `<div class="chip-row">${context.facilityOrigins.map(origin => `<span class="chip ${origin.type === 'rare' ? 'rare' : ''}">${escapeHtml(origin.label)} ${origin.type === 'rare' ? 'rare ' : ''}${origin.chance}%</span>`).join('')}</div>`
        : '<p>No facility source.</p>';
      const domains = affinity
        ? `<p>+${affinity.bonus || 0}% on ${escapeHtml((affinity.domains || []).join(', '))}. ${escapeHtml(affinity.description || '')}</p>`
        : '<p>No broad affinity entry.</p>';
      const contractUse = [
        context.contractUse.primary.length ? `<li><strong>Primary:</strong> ${escapeHtml(uniqueSorted(context.contractUse.primary).join(', '))}</li>` : '',
        context.contractUse.support.length ? `<li><strong>Support:</strong> ${escapeHtml(uniqueSorted(context.contractUse.support).join(', '))}</li>` : ''
      ].filter(Boolean).join('');
      const effectsText = effects.length
        ? `<ul>${effects.map(effect => `<li>${escapeHtml(effect.description || `${effect.trigger}: ${effect.type}`)}</li>`).join('')}</ul>`
        : '<p>No special engine effect.</p>';
      return `
        <article class="${classes.join(' ')}" data-kind="${kind}" data-origins="${origins.join(' ')}" data-search="${escapeAttr(search)}">
          <div class="trait-title">
            <h3>${escapeHtml(name)}</h3>
            <div class="badges">${badges}</div>
          </div>
          <div class="detail-list">
            <div class="detail-block"><strong>Origin</strong>${profession}</div>
            <div class="detail-block"><strong>Facility Source</strong>${facilityText}</div>
            <div class="detail-block"><strong>Broad Fit</strong>${domains}</div>
            <div class="detail-block"><strong>Generated Contracts</strong>${contractUse ? `<ul>${contractUse}</ul>` : '<p>No generated-job requirement listed.</p>'}</div>
            <div class="detail-block"><strong>Engine Effects</strong>${effectsText}</div>
          </div>
        </article>
      `;
    }

    function renderFacilities(facilities) {
      $('facilityGrid').innerHTML = facilities.map(facility => `
        <article class="facility-card">
          <h3>${escapeHtml(facility.label)}</h3>
          <div class="chip-row">
            ${(facility.traits || []).map(trait => `<span class="chip">${escapeHtml(trait)} ${facility.trainChance}%</span>`).join('')}
            ${(facility.rareTraits || []).map(trait => `<span class="chip rare">${escapeHtml(trait)} rare ${Math.round((facility.rareChance ?? 0.12) * 100)}%</span>`).join('')}
          </div>
        </article>
      `).join('');
    }

    function renderGroup(gridId, countId, models) {
      $(countId).textContent = `${models.length} shown`;
      $(gridId).innerHTML = models.map(model => model.html).join('') || '<p class="empty">No traits in this group.</p>';
    }

    function applyFilters() {
      const query = $('search').value.trim().toLowerCase();
      const origin = $('originFilter').value;
      let shown = 0;
      for (const card of state.cards) {
        const origins = card.dataset.origins || '';
        const kind = card.dataset.kind || '';
        const matchesQuery = !query || (card.dataset.search || '').includes(query);
        const matchesOrigin = origin === 'all'
          || kind === origin
          || origins.split(' ').includes(origin);
        const visible = matchesQuery && matchesOrigin;
        card.classList.toggle('hidden', !visible);
        if (visible) shown++;
      }
      for (const [gridId, countId] of [['professionGrid','professionCount'], ['traitGrid','traitCount'], ['tagGrid','tagCount']]) {
        const visible = Array.from($(gridId).querySelectorAll('.trait-card')).filter(card => !card.classList.contains('hidden')).length;
        $(countId).textContent = `${visible} shown`;
      }
    }

    function summaryCard(value, label) {
      return `<article class="summary-card"><strong>${value}</strong><span>${label}</span></article>`;
    }

    function originLabel(origin) {
      return { profession: 'profession', random: 'random', facility: 'facility', rare: 'rare' }[origin] || origin;
    }

    function uniqueSorted(values) {
      return [...new Set(values)].sort((a, b) => a.localeCompare(b));
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
